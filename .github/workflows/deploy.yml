name: Build and deploy to cPanel

# Builds the self-contained standalone bundle on GitHub's servers (so cPanel
# never has to build anything) and syncs it to the cPanel account via FTP.
# Requires three repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# One delivery at a time: a new push cancels any in-flight deploy so two FTP
# syncs never write to the server simultaneously.
concurrency:
  group: cpanel-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build standalone bundle and FTP to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        # hoisted node-linker: flat real directories instead of pnpm's symlink
        # store — symlinks do not survive FTP and produce a broken node_modules
        # on the server.
        run: pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_NODE_LINKER: hoisted

      - name: Build cPanel standalone bundle
        run: pnpm --filter @gns/web build:cpanel
        env:
          NPM_CONFIG_NODE_LINKER: hoisted

      # Passenger restarts the app whenever tmp/restart.txt changes. Writing a
      # fresh timestamp each deploy makes the new build go live automatically —
      # no manual "Restart" click in cPanel.
      - name: Trigger Passenger restart on deploy
        run: mkdir -p apps/web/.next/standalone/tmp && date -u > apps/web/.next/standalone/tmp/restart.txt

      # Breadcrumb to confirm which build reached the server: open
      # gns-app/DEPLOY_INFO.txt in cPanel.
      - name: Write deploy marker
        run: echo "commit ${{ github.sha }} deployed $(date -u)" > apps/web/.next/standalone/DEPLOY_INFO.txt

      - name: Sync bundle to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: apps/web/.next/standalone/
          server-dir: gns-app/
          # Verbose log shows exactly which files upload and where.
          log-level: verbose
          # New state name forces a clean full re-scan/upload (old runs were
          # skipping files against a stale sync-state). Non-destructive.
          state-name: .gns-deploy-state.json
          # The action's DEFAULT exclude list skips **/node_modules/** — but the
          # standalone bundle's node_modules IS the app's runtime. Override the
          # excludes so the pruned node_modules ships with the bundle.
          exclude: |
            **/.git*
            **/.git*/**
